name: DataKit patch regressions

on:
  push:
    branches: [datakit-v0.11]
    tags: ['v0.11.0-dk.*']
  pull_request:
    branches: [datakit-v0.11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'
      - name: Focused regressions
        run: go test -v -count=1 -run 'Test(VDSOAddressNativeWidth|DetachedPerfEnabledTime|ReplacementDrainsRetiredBufferBeforeClosing|ReadBatchNativeDrainAndSparseTail|ForwardReaderNativeCounterWrap|ReverseReaderNativeCounterWrap)$' ./internal ./perf
      - name: Race regressions
        if: matrix.arch == 'amd64'
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -run 'Test(VDSOAddressNativeWidth|DetachedPerfEnabledTime|ReplacementDrainsRetiredBufferBeforeClosing|ReadBatchNativeDrainAndSparseTail)$' ./internal ./perf
      - name: arm64 compilation
        if: matrix.arch == 'amd64'
        env:
          GOARCH: arm64
        run: go build ./...
